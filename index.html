<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Question for You ❤️</title>
<style>
body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: Arial, sans-serif;
  text-align: center;
  background: linear-gradient(135deg, #ffd6e7, #ffe9c8);
  color: #8b174d;
}
.card {
  background: white;
  padding: 30px 22px;
  margin: 18px;
  border-radius: 25px;
  box-shadow: 0 8px 30px #b95b7b55;
  max-width: 340px;
}
h1 { font-size: 28px; }
p { font-size: 18px; line-height: 1.5; }
button {
  border: none;
  border-radius: 30px;
  padding: 15px 27px;
  margin: 10px;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
}
#yes { background: #ff4f91; color: white; }
#no { background: #eeeeee; color: #555; }
#message { min-height: 50px; }
.heart { font-size: 48px; }
</style>
</head>
<body>
<div class="card">
  <div class="heart">💗</div>
  <h1>Hey, Beautiful! 🥹</h1>
  <p>I have one little question for you...</p>
  <h2>Will you say "I love you" to me? ❤️</h2>
  <button id="yes" onclick="sayYes()">YES 💕</button>
  <button id="no" onclick="sayNo()">NO 🙈</button>
  <p id="message"></p>
</div>
<script>
function sayYes() {
  document.getElementById("message").innerHTML =
    "YAYYYYY! 🥹❤️ I knew it! I love you so much, meri jaan! 💋💕";
  document.getElementById("yes").innerHTML = "I LOVE YOU TOO ❤️";
}
function sayNo() {
  document.getElementById("message").innerHTML =
    "⚠️ Oops! Something went wrong! 😂 Please try clicking YES, baby! 💗";
}
</script>
</body>
</html>
